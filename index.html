<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="PlannerPro"/><title>PlannerPro</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet"/><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f0f4ff;font-family:'Nunito',sans-serif}button,input,select,textarea{font-family:'Nunito',sans-serif}.hdr{background:#fff;border-bottom:2px solid #e9ecef;padding:16px 20px;position:sticky;top:0;z-index:100}.logo{font-family:'Syne',sans-serif;font-size:26px;background:linear-gradient(135deg,#748ffc,#cc5de8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{color:#adb5bd;font-size:12px;font-weight:700;margin-top:2px}.btn-add{background:linear-gradient(135deg,#748ffc,#cc5de8);border:none;border-radius:12px;color:#fff;padding:11px 20px;font-size:15px;font-weight:900;cursor:pointer}.srch{width:100%;background:#f8f9fa;border:2px solid #e9ecef;border-radius:12px;padding:10px 14px;font-size:13px;outline:none;margin-top:12px;color:#1a1a2e}.wrap{max-width:600px;margin:0 auto;padding:16px}.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid #e9ecef;background:#f8f9fa;color:#868e96;cursor:pointer}.chip.on{background:rgba(116,143,252,0.12);border-color:#748ffc;color:#748ffc}.card{background:#fff;border-radius:16px;padding:15px 16px;margin-bottom:10px}.ov{position:fixed;inset:0;background:rgba(20,20,50,0.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 44px;width:100%;max-width:520px;max-height:93vh;overflow-y:auto}.handle{width:44px;height:5px;background:#dee2e6;border-radius:3px;margin:0 auto 22px}.lbl{display:block;color:#868e96;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}.inp{width:100%;background:#f8f9fa;border:2px solid #e9ecef;border-radius:10px;color:#1a1a2e;padding:11px 14px;font-size:14px;outline:none}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.nbox{background:#f0f2ff;border-radius:14px;padding:14px 16px}.cbtn{width:32px;height:32px;border-radius:8px;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}.cbtn.minus{background:#fff;border:2px solid #dee2e6;color:#748ffc}.cbtn.plus{background:#748ffc;border:none;color:#fff}.num{font-weight:900;font-size:18px;color:#1a1a2e;min-width:28px;text-align:center}.save{width:100%;background:linear-gradient(135deg,#748ffc,#cc5de8);border:none;border-radius:14px;color:#fff;padding:16px;font-size:15px;font-weight:900;cursor:pointer;margin-top:8px;box-shadow:0 4px 20px rgba(116,143,252,0.35)}.alx{background:#fff0f0;border:2px solid #ffc9c9;border-radius:14px;padding:12px 16px;margin-bottom:8px}.als{background:#fffbf0;border:2px solid #ffe066;border-radius:14px;padding:12px 16px;margin-bottom:14px}.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stcard{border-radius:14px;padding:14px;text-align:center}.empty{text-align:center;padding:50px 0;color:#adb5bd}</style></head><body>
<div class="hdr"><div style="max-width:600px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="logo">PlannerPro</div><div class="sub" id="sub">0 active · 0 finalizate</div></div><div style="display:flex;gap:8px;align-items:center"><button id="nb" style="display:none;background:#fffbf0;border:2px solid #fcc419;border-radius:12px;color:#f59f00;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer">🔔 Activează</button><span id="nok" style="display:none;font-size:22px">🔔</span><button class="btn-add" id="btnadd">+ Adaugă</button></div></div><input class="srch" id="srch" placeholder="🔍  Caută..."/></div></div>
<div class="wrap"><div class="chips" id="cchips"></div><div class="chips" id="schips"></div><div id="alerts"></div><div id="list"></div><div class="stgrid" id="stats"></div></div>
<div class="ov" id="ov" style="display:none"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 id="ftitle" style="font-family:'Syne',sans-serif;font-size:22px;color:#1a1a2e"></h2><button id="btnclose" style="background:#f8f9fa;border:none;border-radius:10px;color:#868e96;padding:8px 13px;font-size:17px;cursor:pointer">✕</button></div><div style="display:flex;flex-direction:column;gap:15px"><div><label class="lbl">Titlu *</label><input class="inp" id="ft" placeholder="Ex: Asigurare auto..."/></div><div><label class="lbl">Categorie</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="fcats"></div></div><div><label class="lbl">Descriere</label><textarea class="inp" id="fd" style="height:70px;resize:vertical" placeholder="Detalii..."></textarea></div><div class="g2"><div><label class="lbl">Data</label><input type="date" class="inp" id="fdate"/></div><div><label class="lbl">Ora</label><input type="time" class="inp" id="ftime"/></div></div><div class="nbox" id="nbox" style="display:none"><label class="lbl" style="color:#748ffc;margin-bottom:10px">🔔 Notifică-mă cu...</label><div class="g3"><div><label class="lbl" style="font-size:10px">Zile</label><div style="display:flex;align-items:center;gap:5px"><button class="cbtn minus" id="dd">−</button><span class="num" id="nd">0</span><button class="cbtn plus" id="di">+</button></div></div><div><label class="lbl" style="font-size:10px">Ore</label><div style="display:flex;align-items:center;gap:5px"><button class="cbtn minus" id="hd">−</button><span class="num" id="nh">1</span><button class="cbtn plus" id="hi">+</button></div></div><div><label class="lbl" style="font-size:10px">Minute</label><div style="display:flex;align-items:center;gap:5px"><button class="cbtn minus" id="md">−</button><span class="num" id="nm">0</span><button class="cbtn plus" id="mi">+</button></div></div></div><p id="nprev" style="margin-top:10px;font-size:11px;color:#748ffc;font-weight:700"></p></div><div class="g2"><div><label class="lbl">Repetare</label><select class="inp" id="frep"><option value="none">Fără repetare</option><option value="daily">Zilnic</option><option value="weekly">Săptămânal</option><option value="monthly">Lunar</option><option value="yearly">Anual</option></select></div><div><label class="lbl">Prioritate</label><select class="inp" id="fpri"><option value="low">Scăzută</option><option value="medium">Medie</option><option value="high">Ridicată</option></select></div></div><button class="save" id="fsave">✨ Adaugă</button></div></div></div>
<script>
const CATS=[{id:"home",label:"Casnic",icon:"🏠",color:"#ff6b6b",bg:"#fff0f0"},{id:"work",label:"Profesional",icon:"💼",color:"#4dabf7",bg:"#f0f8ff"},{id:"finance",label:"Financiar",icon:"💳",color:"#51cf66",bg:"#f0fff4"},{id:"insurance",label:"Asigurări",icon:"🛡️",color:"#fcc419",bg:"#fffbf0"},{id:"events",label:"Evenimente",icon:"🎵",color:"#cc5de8",bg:"#fdf0ff"},{id:"bills",label:"Facturi",icon:"📄",color:"#ff8c42",bg:"#fff5f0"},{id:"sport",label:"Sport",icon:"⚽",color:"#20c997",bg:"#f0fff8"},{id:"vacation",label:"Concedii",icon:"🏖️",color:"#f06595",bg:"#fff0f5"},{id:"citybreak",label:"City Breaks",icon:"✈️",color:"#748ffc",bg:"#f0f2ff"}];
const REPS={none:"Fără repetare",daily:"Zilnic",weekly:"Săptămânal",monthly:"Lunar",yearly:"Anual"};
const PRIS={low:{label:"Scăzută",color:"#51cf66",bg:"#f0fff4"},medium:{label:"Medie",color:"#fcc419",bg:"#fffbf0"},high:{label:"Ridicată",color:"#ff6b6b",bg:"#fff0f0"}};
let tasks=[],editId=null,catF="all",statF="all",selCat="home",notifOk=false,timers={};
try{tasks=JSON.parse(localStorage.getItem("pp2")||"[]")}catch{}
function save(){try{localStorage.setItem("pp2",JSON.stringify(tasks))}catch{}}
function days(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);return Math.ceil((x-t)/86400000)}
function fmt(d){if(!d)return"";return new Date(d).toLocaleDateString("ro-RO",{day:"2-digit",month:"long",year:"numeric"})}
function notifMs(t){if(!t.dueDate)return null;const[y,m,d]=t.dueDate.split("-").map(Number);const[h,mi]=t.dueTime?t.dueTime.split(":").map(Number):[9,0];const ev=new Date(y,m-1,d,h,mi).getTime();return ev-(t.nd||0)*86400000-(t.nh||0)*3600000-(t.nm||0)*60000-Date.now()}
function schedNotifs(){Object.values(timers).forEach(clearTimeout);timers={};if(!notifOk)return;tasks.forEach(t=>{if(t.done||!t.dueDate)return;const ms=notifMs(t);if(!ms||ms<0)return;const c=CATS.find(x=>x.id===t.cat)||CATS[0];timers[t.id]=setTimeout(()=>{try{new Notification(c.icon+" "+t.title,{body:t.dueTime?"Astăzi la "+t.dueTime:fmt(t.dueDate)})}catch{}},ms)})}
function chkNotif(){if(typeof Notification==="undefined")return;if(Notification.permission==="granted"){notifOk=true;document.getElementById("nok").style.display="inline";document.getElementById("nb").style.display="none"}else{document.getElementById("nb").style.display="inline-block"}}
async function reqNotif(){if(typeof Notification==="undefined")return;const p=await Notification.requestPermission();if(p==="granted"){notifOk=true;document.getElementById("nok").style.display="inline";document.getElementById("nb").style.display="none";schedNotifs()}}
function badge(d){if(d===null)return"";const s="border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800";if(d<0)return`<span style="${s};background:#fff0f0;color:#ff6b6b">EXPIRAT</span>`;if(d===0)return`<span style="${s};background:#fffbf0;color:#f59f00">AZI</span>`;if(d<=3)return`<span style="${s};background:#fff4e6;color:#ff8c42">${d} zile</span>`;if(d<=7)return`<span style="${s};background:#f0f8ff;color:#4dabf7">${d} zile</span>`;return`<span style="${s};background:#f0fff4;color:#51cf66">${d} zile</span>`}
function nprev(){const d=+document.getElementById("nd").textContent,h=+document.getElementById("nh").textContent,m=+document.getElementById("nm").textContent;const p=[];if(d)p.push(d+"z");if(h)p.push(h+"h");if(m)p.push(m+"min");document.getElementById("nprev").textContent=(p.length?"🔔 −"+p.join(" "):"🔔 la eveniment")+" înainte"}
function openForm(id){
  editId=id||null;
  document.getElementById("ftitle").textContent=id?"✏️ Editează":"✨ Sarcină nouă";
  document.getElementById("fsave").textContent=id?"💾 Salvează":"✨ Adaugă";
  if(id){const t=tasks.find(x=>x.id===id);document.getElementById("ft").value=t.title||"";document.getElementById("fd").value=t.desc||"";document.getElementById("fdate").value=t.dueDate||"";document.getElementById("ftime").value=t.dueTime||"";document.getElementById("frep").value=t.repeat||"none";document.getElementById("fpri").value=t.priority||"medium";document.getElementById("nd").textContent=t.nd||0;document.getElementById("nh").textContent=t.nh||1;document.getElementById("nm").textContent=t.nm||0;selCat=t.cat||"home";document.getElementById("nbox").style.display=t.dueDate?"block":"none"}
  else{document.getElementById("ft").value="";document.getElementById("fd").value="";document.getElementById("fdate").value="";document.getElementById("ftime").value="";document.getElementById("frep").value="none";document.getElementById("fpri").value="medium";document.getElementById("nd").textContent="0";document.getElementById("nh").textContent="1";document.getElementById("nm").textContent="0";selCat="home";document.getElementById("nbox").style.display="none"}
  buildFcats();nprev();document.getElementById("ov").style.display="flex"
}
function closeForm(){document.getElementById("ov").style.display="none";editId=null}
function buildFcats(){document.getElementById("fcats").innerHTML=CATS.map(c=>`<button type="button" onclick="selCatFn('${c.id}')" style="background:${selCat===c.id?c.bg:"#f8f9fa"};border:2px solid ${selCat===c.id?c.color:"#e9ecef"};border-radius:10px;color:${selCat===c.id?c.color:"#868e96"};padding:7px 11px;font-size:12px;cursor:pointer;font-weight:700">${c.icon} ${c.label}</button>`).join("")}
function selCatFn(id){selCat=id;buildFcats()}
function inc(id,step,max){const el=document.getElementById(id);el.textContent=Math.min(max,+el.textContent+step);nprev()}
function dec(id,step){const el=document.getElementById(id);el.textContent=Math.max(0,+el.textContent-step);nprev()}
function saveTask(){
  const title=document.getElementById("ft").value.trim();if(!title)return;
  const t={id:editId||Date.now().toString(),title,desc:document.getElementById("fd").value,cat:selCat,priority:document.getElementById("fpri").value,dueDate:document.getElementById("fdate").value,dueTime:document.getElementById("ftime").value,repeat:document.getElementById("frep").value,nd:+document.getElementById("nd").textContent,nh:+document.getElementById("nh").textContent,nm:+document.getElementById("nm").textContent,done:editId?tasks.find(x=>x.id===editId)?.done||false:false};
  if(editId){tasks=tasks.map(x=>x.id===editId?t:x)}else{tasks.push(t)}
  save();schedNotifs();closeForm();render()
}
function delTask(id){if(confirm("Ștergi această sarcină?")){{tasks=tasks.filter(t=>t.id!==id);save();schedNotifs();render()}}}
function togDone(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()}
function render(){
  const srch=document.getElementById("srch").value.toLowerCase();
  const active=tasks.filter(t=>!t.done).length,done=tasks.filter(t=>t.done).length;
  document.getElementById("sub").textContent=active+" active · "+done+" finalizate";
  const expired=tasks.filter(t=>!t.done&&t.dueDate&&days(t.dueDate)<0);
  const soon=tasks.filter(t=>!t.done&&t.dueDate).filter(t=>{const d=days(t.dueDate);return d!==null&&d>=0&&d<=(t.nd||0)+1});
  let ah="";
  if(expired.length)ah+=`<div class="alx"><div style="color:#ff6b6b;font-weight:800;font-size:13px;margin-bottom:4px">🚨 Expirate (${expired.length})</div>${expired.map(t=>`<div style="color:#e03131;font-size:12px;font-weight:600">• ${t.title} — ${fmt(t.dueDate)}</div>`).join("")}</div>`;
  if(soon.length)ah+=`<div class="als"><div style="color:#f59f00;font-weight:800;font-size:13px;margin-bottom:4px">⚠️ Scadente curând (${soon.length})</div>${soon.map(t=>{const d=days(t.dueDate);return`<div style="color:#e67700;font-size:12px;font-weight:600">• ${t.title} — ${d===0?"AZI":"în "+d+" zi(le)"}</div>`}).join("")}</div>`;
  document.getElementById("alerts").innerHTML=ah;
  let fl=tasks.filter(t=>{if(statF==="active"&&t.done)return false;if(statF==="completed"&&!t.done)return false;if(statF==="upcoming"&&(t.done||!t.dueDate||days(t.dueDate)>7))return false;if(catF!=="all"&&t.cat!==catF)return false;if(srch&&!t.title.toLowerCase().includes(srch)&&!(t.desc||"").toLowerCase().includes(srch))return false;return true}).sort((a,b)=>{if(!a.dueDate&&!b.dueDate)return 0;if(!a.dueDate)return 1;if(!b.dueDate)return-1;return new Date(a.dueDate)-new Date(b.dueDate)});
  if(!fl.length){document.getElementById("list").innerHTML=`<div class="empty"><div style="font-size:48px;margin-bottom:10px">📋</div><div style="font-size:15px;font-weight:700;color:#868e96">Nicio sarcină</div><div style="font-size:12px;margin-top:4px">Apasă + Adaugă</div></div>`;return}
  document.getElementById("list").innerHTML=fl.map(t=>{const c=CATS.find(x=>x.id===t.cat)||CATS[0];const p=PRIS[t.priority]||PRIS.medium;const d=days(t.dueDate);const pp=[];if(t.nd)pp.push(t.nd+"z");if(t.nh)pp.push(t.nh+"h");if(t.nm)pp.push(t.nm+"min");const nl=pp.length?"🔔 −"+pp.join(" "):"🔔 la eveniment";return`<div class="card" style="border:2px solid ${t.done?"#e9ecef":c.color+"55"};border-left:4px solid ${t.done?"#dee2e6":c.color};opacity:${t.done?0.6:1};box-shadow:${t.done?"none":"0 2px 12px "+c.color+"18"}"><div style="display:flex;align-items:flex-start;gap:12px"><button onclick="togDone('${t.id}')" style="width:26px;height:26px;min-width:26px;border-radius:50%;border:2px solid ${t.done?"#adb5bd":c.color};background:${t.done?"#adb5bd":"white"};cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:900;margin-top:1px;flex-shrink:0">${t.done?"✓":""}</button><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:15px;font-weight:700;color:${t.done?"#adb5bd":"#1a1a2e"};text-decoration:${t.done?"line-through":"none"};font-family:'Syne',sans-serif">${c.icon} ${t.title}</span>${badge(d)}</div><div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap"><span style="background:${c.bg};color:${c.color};border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">${c.label}</span><span style="background:${p.bg};color:${p.color};border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">${p.label}</span>${t.repeat!=="none"?`<span style="background:#f0f2ff;color:#748ffc;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">🔁 ${REPS[t.repeat]}</span>`:""}</div>${t.desc?`<p style="margin:6px 0 0;font-size:12px;color:#868e96;line-height:1.5">${t.desc}</p>`:""}<div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap">${t.dueDate?`<span style="font-size:11px;color:#868e96">📅 ${fmt(t.dueDate)}${t.dueTime?" la "+t.dueTime:""}</span>`:""}${t.dueDate?`<span style="font-size:11px;color:#adb5bd">${nl}</span>`:""}</div></div><div style="display:flex;gap:6px;flex-shrink:0"><button onclick="openForm('${t.id}')" style="background:#f8f9fa;border:2px solid #e9ecef;border-radius:8px;color:#495057;cursor:pointer;padding:5px 8px;font-size:13px">✏️</button><button onclick="delTask('${t.id}')" style="background:#fff0f0;border:2px solid #ffc9c9;border-radius:8px;color:#ff6b6b;cursor:pointer;padding:5px 8px;font-size:13px">🗑</button></div></div></div>`}).join("");
  if(tasks.length){document.getElementById("stats").innerHTML=[{label:"Active",value:active,color:"#748ffc",bg:"#f0f2ff"},{label:"Finalizate",value:done,color:"#51cf66",bg:"#f0fff4"},{label:"Expirate",value:expired.length,color:"#ff6b6b",bg:"#fff0f0"}].map(s=>`<div class="stcard" style="background:${s.bg};border:2px solid ${s.color}33"><div style="font-size:26px;font-weight:800;color:${s.color};font-family:'Syne',sans-serif">${s.value}</div><div style="font-size:11px;color:${s.color}bb;font-weight:700;margin-top:2px">${s.label}</div></div>`).join("")}
  document.getElementById("cchips").innerHTML=`<button class="chip ${catF==="all"?"on":""}" onclick="setCatF('all')">Toate</button>`+CATS.map(c=>`<button class="chip ${catF===c.id?"on":""}" style="${catF===c.id?"background:"+c.color+"18;border-color:"+c.color+";color:"+c.color:""}" onclick="setCatF('${c.id}')">${c.icon} ${c.label}</button>`).join("");
  document.getElementById("schips").innerHTML=[["all","Toate"],["active","Active"],["upcoming","7 zile"],["completed","Finalizate"]].map(([v,l])=>`<button class="chip ${statF===v?"on":""}" onclick="setStatF('${v}')">${l}</button>`).join("");
}
function setCatF(v){catF=v;render()}
function setStatF(v){statF=v;render()}
document.getElementById("btnadd").addEventListener("click",function(){openForm()});
document.getElementById("btnclose").addEventListener("click",function(){closeForm()});
document.getElementById("fsave").addEventListener("click",function(){saveTask()});
document.getElementById("ov").addEventListener("click",function(e){if(e.target===this)closeForm()});
document.getElementById("fdate").addEventListener("change",function(){document.getElementById("nbox").style.display=this.value?"block":"none";nprev()});
document.getElementById("srch").addEventListener("input",function(){render()});
document.getElementById("nb").addEventListener("click",function(){reqNotif()});
document.getElementById("dd").addEventListener("click",function(){dec("nd",1)});
document.getElementById("di").addEventListener("click",function(){inc("nd",1,30)});
document.getElementById("hd").addEventListener("click",function(){dec("nh",1)});
document.getElementById("hi").addEventListener("click",function(){inc("nh",1,23)});
document.getElementById("md").addEventListener("click",function(){dec("nm",5)});
document.getElementById("mi").addEventListener("click",function(){inc("nm",5,55)});
chkNotif();render();
</script>
</body></html>
